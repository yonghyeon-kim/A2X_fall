<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A2X센터 추석 게임한마당 개인전</title>
<style>
  :root {
    --ice: #eaf4fb;
    --ice-deep: #cfe6f5;
    --navy: #113a5d;
    --blue: #1e6fa8;
    --red: #c0392b;
    --line: #b9d4e6;
    --gold: #d4af37;
    --silver: #9fb0bd;
    --bronze: #cd7f32;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    background: linear-gradient(160deg, #f5fbff 0%, #dcecf7 100%);
    color: var(--navy);
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  header { text-align: center; margin-bottom: 16px; }
  header h1 { margin: 0; font-size: clamp(20px, 4vw, 32px); letter-spacing: 1px; line-height: 1.3; }
  header .sub { color: var(--blue); font-size: 13px; margin-top: 6px; }

  .toolbar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 18px 0 22px; }
  button.tool {
    border: none; border-radius: 10px; padding: 10px 18px;
    font-size: 15px; font-weight: 700; cursor: pointer; color: #fff;
    background: var(--blue); box-shadow: 0 3px 8px rgba(0,0,0,.15);
    transition: transform .05s ease, filter .15s ease;
  }
  button.tool:hover { filter: brightness(1.08); }
  button.tool:active { transform: translateY(1px); }
  button.tool.add { background: var(--navy); }
  button.tool.edit { background: #2e8b57; }
  button.tool.edit.active { background: #d68910; }
  button.tool.reset { background: var(--red); }

  .tabs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; max-width: 900px; margin: 0 auto 20px; }
  .tab {
    border: 1px solid var(--line); background: #fff; color: var(--navy);
    border-radius: 10px 10px 0 0; padding: 10px 16px; font-size: 14px; font-weight: 700;
    cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,.06);
  }
  .tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }

  .panel { max-width: 900px; margin: 0 auto; }

  .podium { display: flex; justify-content: center; align-items: flex-end; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .pcard {
    border-radius: 14px; padding: 14px 16px; text-align: center; color: #fff;
    min-width: 120px; box-shadow: 0 6px 18px rgba(0,0,0,.18);
  }
  .pcard.p1 { background: linear-gradient(160deg,#e9c94a,#c9a227); order: 2; transform: translateY(-8px); min-width: 140px; }
  .pcard.p2 { background: linear-gradient(160deg,#b7c6d2,#8b9aa7); order: 1; }
  .pcard.p3 { background: linear-gradient(160deg,#dd9a5b,#b8722f); order: 3; }
  .pcard .medal { font-size: 30px; }
  .pcard .pname { font-size: 18px; font-weight: 800; margin: 4px 0; word-break: break-all; }
  .pcard .ptask { font-size: 11px; opacity: .9; margin-bottom: 6px; min-height: 14px; }
  .pcard .pscore { font-size: 20px; font-weight: 900; }

  .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch;
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 6px 20px rgba(30,111,168,.12); }
  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  th, td { border-bottom: 1px solid var(--line); text-align: center; padding: 11px 8px; font-size: 15px; }
  thead th { background: var(--ice); color: var(--navy); font-weight: 700; font-size: 13px; }
  td.name { text-align: left; padding-left: 16px; font-weight: 700; }
  td.task { color: #5a7488; font-size: 13px; }
  td.score { font-weight: 800; }
  tr.rank-1 { background: linear-gradient(90deg, rgba(212,175,55,.22), transparent); }
  tr.rank-2 { background: linear-gradient(90deg, rgba(159,176,189,.22), transparent); }
  tr.rank-3 { background: linear-gradient(90deg, rgba(205,127,50,.20), transparent); }
  td.rankcell { font-weight: 800; width: 64px; }
  .empty { text-align: center; padding: 34px 10px; color: #7a99ad; }
  .row-actions button {
    border: none; border-radius: 7px; padding: 7px 10px; font-size: 14px;
    font-weight: 700; cursor: pointer; margin: 2px; color: #fff; min-width: 38px; min-height: 34px;
  }
  .row-actions .e { background: var(--blue); }
  .row-actions .d { background: var(--red); }
  .row-actions .m { background: #5a7488; }
  .row-actions .rb { background: #9fb0bd; }
  .row-actions .rb.on { background: #d68910; }
  .rbadge {
    display: inline-block; font-size: 11px; font-weight: 700; color: #b8722f;
    background: #fff3e0; border: 1px solid #e0b070; border-radius: 6px; padding: 1px 6px; margin-right: 4px;
    white-space: nowrap;
  }

  .mode-badge { text-align:center; margin: 0 auto 14px; font-size: 13px; font-weight:700; color:#d68910; }

  /* Overlay + modal */
  .overlay { position: fixed; inset: 0; background: rgba(17,58,93,.45);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 14px; padding: 22px; width: min(400px, 94vw);
    box-shadow: 0 10px 40px rgba(0,0,0,.3); text-align: center; }
  .modal h3 { margin: 0 0 14px; font-size: 18px; }
  .modal p { margin: 0 0 14px; font-size: 14px; color:#456; line-height:1.5; }
  .modal label { display:block; text-align:left; font-size: 13px; font-weight:700; margin: 10px 0 4px; }
  .modal input, .modal select {
    width: 100%; padding: 11px 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background:#fff;
  }
  .modal .unit-row { display:flex; align-items:center; gap:8px; }
  .modal .unit-row input { flex:1; }
  .modal .unit { font-weight:800; color:var(--navy); }
  .modal .err { color: var(--red); font-size: 13px; min-height: 18px; margin: 10px 0; }
  .modal .btns { display: flex; gap: 10px; justify-content: center; margin-top: 6px; }
  .modal .btns button { border: none; border-radius: 8px; padding: 11px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
  .modal .ok { background: var(--blue); color: #fff; }
  .modal .danger { background: var(--red); color: #fff; }
  .modal .cancel { background: #e3ebf1; color: var(--navy); }

  @media (max-width: 640px) {
    body { padding: 14px 8px 48px; }
    .tab { padding: 9px 12px; font-size: 13px; }
    button.tool { flex: 1 1 42%; min-width: 130px; padding: 12px 10px; }
    .pcard { min-width: 100px; padding: 12px; }
    .pcard.p1 { min-width: 112px; }
    th, td { padding: 10px 6px; font-size: 14px; }
    .row-actions button { min-width: 40px; min-height: 40px; font-size: 15px; }
    td.row-actions { white-space: normal; width: 100px; }
    .rbadge { display: block; margin: 0 0 3px; }
  }
  @media (max-width: 380px) {
    button.tool { flex: 1 1 100%; }
  }
</style>
</head>
<body>
  <header>
    <h1>🍾 A2X센터 추석 게임한마당 개인전</h1>
  </header>

  <div class="toolbar">
    <button class="tool add" id="btnAdd">➕ 기록 등록</button>
    <button class="tool edit" id="btnEdit">✏️ Edit</button>
    <button class="tool reset" id="btnReset">↺ 초기화</button>
  </div>

  <div class="mode-badge" id="modeBadge"></div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

  <!-- PW / confirm overlay -->
  <div class="overlay" id="pwOverlay">
    <div class="modal">
      <h3 id="pwTitle">관리자 인증</h3>
      <p id="pwMsg"></p>
      <input type="password" id="pwInput" placeholder="관리자 PW 입력" autocomplete="off" />
      <div class="err" id="pwErr"></div>
      <div class="btns" id="pwBtns"></div>
    </div>
  </div>

  <!-- Record form overlay -->
  <div class="overlay" id="formOverlay">
    <div class="modal">
      <h3 id="formTitle">기록 등록</h3>
      <label for="fName">이름</label>
      <input type="text" id="fName" placeholder="이름 입력" autocomplete="off" />
      <label for="fOrg">조직</label>
      <select id="fOrg"></select>
      <label for="fTask">Task</label>
      <select id="fTask"></select>
      <label for="fScore">기록</label>
      <div class="unit-row">
        <input type="number" id="fScore" inputmode="decimal" min="0" step="0.1" placeholder="숫자만 입력" />
        <span class="unit">cm</span>
      </div>
      <div class="err" id="formErr"></div>
      <div class="btns">
        <button class="ok" id="formSave">저장</button>
        <button class="cancel" id="formCancel">취소</button>
      </div>
    </div>
  </div>

  // ---------- crypto / obfuscation helpers ----------
  function sha256Hex(str) {
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)).then(function (buf) {

    var key = new TextEncoder().encode(OBF_KEY);
    var bytes = new Uint8Array(arr.length);
    for (var i = 0; i < arr.length; i++) bytes[i] = arr[i] ^ key[i % key.length];
    return new TextDecoder().decode(bytes);

  var ORGS = JSON.parse(deobfuscate(DATA)); // [{n, t:[...]}]
  var NONE = "선택 안함";

  function sortKo(arr) {
    return arr.slice().sort(function (a, b) { return a.localeCompare(b, "ko"); });
  }

  // ---------- state ----------
  var records = loadRecords();  // [{id, name, org(index), task(string), score(number)}]
  var activeTab = 0;
  var editMode = false;

  function loadRecords() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return [];
      var r = JSON.parse(raw);
      return Array.isArray(r) ? r : [];
    } catch (e) { return []; }
  }
  function saveRecords() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch (e) {}
    if (_stateRef) { try { _stateRef.set(JSON.stringify(records)); } catch (e) {} }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  function fmtScore(n) {
    var v = Number(n);
    if (!isFinite(v)) return "-";
    return v.toString() + " cm";
  }

  function renderTabs() {
    var tabs = document.getElementById("tabs");
    tabs.innerHTML = "";

  function render() {

      pwTitle.textContent = "관리자 인증";
      pwMsg.textContent = actionLabel ? (actionLabel + " 하려면 관리자 PW를 입력하세요.") : "관리자 PW를 입력하세요.";
      pwInput.style.display = ""; pwInput.value = ""; pwErr.textContent = "";
      pwBtns.innerHTML = "";
      var ok = document.createElement("button"); ok.className = "ok"; ok.textContent = "확인";
      var cancel = document.createElement("button"); cancel.className = "cancel"; cancel.textContent = "취소";
      pwBtns.appendChild(ok); pwBtns.appendChild(cancel);
      function verify() {
        var val = (pwInput.value || "").trim().toLowerCase();
        sha256Hex(val).then(function (h) {
          if (PW_HASHES.indexOf(h) !== -1) { closePw(); resolve(true); }
          else { pwErr.textContent = "❌ PW가 올바르지 않습니다."; pwInput.select(); }
        });
      }
      ok.onclick = verify;
      cancel.onclick = function () { closePw(); resolve(false); };
      pwInput.onkeydown = function (ev) { if (ev.key === "Enter") verify(); };
      pwOverlay.classList.add("show");
      setTimeout(function () { pwInput.focus(); }, 50);
    });
  }

  function askConfirm(title, message) {
    return new Promise(function (resolve) {
      pwTitle.textContent = title; pwMsg.textContent = message;
      pwInput.style.display = "none"; pwErr.textContent = ""; pwBtns.innerHTML = "";
      var yes = document.createElement("button"); yes.className = "danger"; yes.textContent = "예";
      var no = document.createElement("button"); no.className = "cancel"; no.textContent = "아니오";
      pwBtns.appendChild(yes); pwBtns.appendChild(no);
      yes.onclick = function () { closePw(); pwInput.style.display = ""; resolve(true); };
      no.onclick = function () { closePw(); pwInput.style.display = ""; resolve(false); };
      pwOverlay.classList.add("show");
    });
  }

  // ---------- Form modal ----------
  var formOverlay = document.getElementById("formOverlay");
  var fName = document.getElementById("fName");
  var fOrg = document.getElementById("fOrg");
  var fTask = document.getElementById("fTask");
  var fScore = document.getElementById("fScore");
  var formErr = document.getElementById("formErr");
  var formTitle = document.getElementById("formTitle");
  var editingId = null;

  function buildOrgSelect(selectedIdx) {
    var opts = ORGS.map(function (o, i) { return { i: i, n: o.n }; });
    opts.sort(function (a, b) { return a.n.localeCompare(b.n, "ko"); });
    fOrg.innerHTML = "";
    opts.forEach(function (o) {
      var el = document.createElement("option");
      el.value = o.i; el.textContent = o.n;
      if (o.i === selectedIdx) el.selected = true;
      fOrg.appendChild(el);
    });
  }
  function buildTaskSelect(orgIdx, selectedTask) {
    fTask.innerHTML = "";
    var none = document.createElement("option");
    none.value = ""; none.textContent = NONE;
    fTask.appendChild(none);
    sortKo(ORGS[orgIdx].t).forEach(function (t) {
      var el = document.createElement("option");
      el.value = t; el.textContent = t;
      if (t === selectedTask) el.selected = true;
      fTask.appendChild(el);
    });
    if (!selectedTask) none.selected = true;
  }

  fOrg.addEventListener("change", function () {
    buildTaskSelect(parseInt(fOrg.value, 10), "");
  });

  function openForm(mode, rec) {
    editingId = mode === "edit" ? rec.id : null;
    formTitle.textContent = mode === "edit" ? "기록 편집" : "기록 등록";
    formErr.textContent = "";
    fName.value = rec ? rec.name : "";
    var orgIdx = rec ? rec.org : 0;
    buildOrgSelect(orgIdx);
    fOrg.value = String(orgIdx);
    buildTaskSelect(orgIdx, rec ? rec.task : "");
    fScore.value = rec && rec.score !== null && rec.score !== undefined ? rec.score : "";
    formOverlay.classList.add("show");
    setTimeout(function () { fName.focus(); }, 50);
  }
  function closeForm() { formOverlay.classList.remove("show"); editingId = null; }

  document.getElementById("formCancel").onclick = closeForm;
  document.getElementById("formSave").onclick = function () {
    var name = fName.value.trim();
    var org = parseInt(fOrg.value, 10);
    var task = fTask.value; // "" = 선택 안함
    var scoreRaw = fScore.value.trim();
    if (!name) { formErr.textContent = "이름을 입력하세요."; return; }
    if (isNaN(org)) { formErr.textContent = "조직을 선택하세요."; return; }
    if (scoreRaw === "" || isNaN(Number(scoreRaw))) { formErr.textContent = "기록(cm)을 숫자로 입력하세요."; return; }
    var score = Number(scoreRaw);
    if (score < 0) { formErr.textContent = "기록은 0 이상이어야 합니다."; return; }

    if (editingId) {
      var r = records.find(function (x) { return x.id === editingId; });
      if (r) { r.name = name; r.org = org; r.task = task; r.score = score; }
    } else {
      records.push({ id: uid(), name: name, org: org, task: task, score: score });
    }
    saveRecords();
    activeTab = org;
    closeForm();
    render();
  };

  // ---------- toolbar / row actions ----------
  document.getElementById("btnAdd").addEventListener("click", async function () {
    var ok = await askPassword("기록을 등록");
    if (ok) openForm("add", null);
  });
  document.getElementById("btnEdit").addEventListener("click", async function () {
    if (editMode) { editMode = false; render(); return; }
    var ok = await askPassword("편집 모드를 시작");
    if (ok) { editMode = true; render(); }
  });
  document.getElementById("btnReset").addEventListener("click", async function () {
    var ok = await askPassword("전체 기록을 초기화");
    if (!ok) return;
    var sure = await askConfirm("초기화 확인", "등록된 모든 기록이 삭제됩니다. 정말 초기화할까요?");
    if (!sure) return;
    records = [];
    saveRecords(); render();
  });

  document.getElementById("panel").addEventListener("click", async function (ev) {
    var t = ev.target;
    var editId = t.getAttribute && t.getAttribute("data-edit");
    var delId = t.getAttribute && t.getAttribute("data-del");
    var moveDir = t.getAttribute && t.getAttribute("data-move");
    var rematchId = t.getAttribute && t.getAttribute("data-rematch");
    if (editId) {
      var r = records.find(function (x) { return x.id === editId; });
      if (r) openForm("edit", r);
    } else if (delId) {
      var rec = records.find(function (x) { return x.id === delId; });
      var nm = rec ? rec.name : "";
      var sure = await askConfirm("삭제 확인", "'" + nm + "' 님의 기록을 삭제할까요?");
      if (sure) {
        records = records.filter(function (x) { return x.id !== delId; });
        saveRecords(); render();
      }
    } else if (moveDir) {
      moveRec(t.getAttribute("data-id"), moveDir);
    } else if (rematchId) {
      var rr = records.find(function (x) { return x.id === rematchId; });
      if (rr) { rr.rc = !rr.rc; saveRecords(); render(); }
    }
  });

  // 실시간 동기화: 클라우드 변경을 구독
  if (_stateRef) {
    _stateRef.on("value", function (snap) {
      var val = snap.val();
      if (val == null) {
        if (records.length) { try { _stateRef.set(JSON.stringify(records)); } catch (e) {} }
        return;
      }
      try {
        var arr = JSON.parse(val);
        if (Array.isArray(arr)) {
          records = arr;
          try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch (e) {}
          render();
        }
      } catch (e) {}
    });
  }

  render();
})();
</script>
</body>
</html>
